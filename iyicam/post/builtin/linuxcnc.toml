id = "linuxcnc"
name = "LinuxCNC mm"
description = "LinuxCNC (EMC2) with path blending and tool length offsets"
extension = "ngc"

[options]
decimals = 4
drill_cycles = true

[blocks]
header = """
%
({file_name})
(Project: {project_name} / {sheet_name})
(Generated by iyiCAM {date} {time})
(Estimated time: {total_time})
{unit_code} G90 G94 G17 G40 G49 G80 G91.1
G64 P0.01
G0 Z{safe_z}
"""
tool_change = """
M5
G0 Z{safe_z}
T{tool_number} M6
G43 H{tool_number}
(Tool {tool_number}: {tool_name})
S{spindle_speed} {spindle_dir_code}
{coolant_code}
"""
toolpath_start = "({toolpath_name})"
rapid = "{G} {X} {Y} {Z}"
linear = "{G} {X} {Y} {Z} {F}"
arc = "{G} {X} {Y} {Z} {I} {J} {F}"
footer = """
G0 Z{safe_z}
M5
M9
G49
G0 X{home_x} Y{home_y}
M2
%
"""
