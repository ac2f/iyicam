id = "mach4"
extends = "mach3"
name = "Mach4 mm"
description = "Newfangled Mach4 (mill / router profile) with tool length offsets"

[options]
g_leading_zero = true
drill_cycles = true

[blocks]
header = """
%
( {file_name} )
( Project: {project_name} / {sheet_name} )
( Generated by iyiCAM {date} {time} )
( Tools: {tools} )
( Estimated time: {total_time} )
G00 G17 {unit_code} G40 G49 G80 G90 G94 G91.1
G00 Z{safe_z}
"""
tool_change = """
M05
G00 Z{safe_z}
T{tool_number} M06
( Tool {tool_number}: {tool_name} D{tool_diameter} )
G43 H{tool_number}
S{spindle_speed} {spindle_dir_code}
{coolant_code}
"""
footer = """
G00 Z{safe_z}
M05
M09
G49
G00 X{home_x} Y{home_y}
M30
%
"""
