id = "mach3"
name = "Mach3 mm"
description = "ArtSoft Mach3, incremental IJ arcs"
extension = "tap"

[options]
decimals = 4
line_ending = "crlf"

[blocks]
header = """
%
( {file_name} )
( Project: {project_name} / {sheet_name} )
( Generated by iyiCAM {date} {time} )
( Material: {sheet_width} x {sheet_height} x {material_thickness} {units} )
( Tools: {tools} )
( Estimated time: {total_time} )
G90 G94 G91.1 G40 G49 G17
{unit_code}
G0 Z{safe_z}
"""
tool_change = """
M5
G0 Z{safe_z}
T{tool_number} M6
( Tool {tool_number}: {tool_name} D{tool_diameter} )
S{spindle_speed} {spindle_dir_code}
{coolant_code}
"""
toolpath_start = "( {toolpath_name} - {toolpath_time} )"
rapid = "{G} {X} {Y} {Z}"
linear = "{G} {X} {Y} {Z} {F}"
arc = "{G} {X} {Y} {Z} {I} {J} {F}"
footer = """
G0 Z{safe_z}
M5
M9
G0 X{home_x} Y{home_y}
M30
%
"""
