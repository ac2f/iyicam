name: build

# Tests on every push; a packaged program (Windows, Linux, macOS) for every tag v* and on request
# (Actions > build > Run workflow). The packages are attached to the run, and to the release of a tag.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Libraries Qt needs without a screen
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
        if: matrix.os != 'macos-latest'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        if: matrix.os == 'macos-latest'
      - name: Libraries Qt needs without a screen
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install ".[gui]" pyinstaller
      - name: Package
        run: python packaging/build.py ${{ matrix.os == 'windows-latest' && '--installer' || '' }}
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: iyiCAM-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*-setup.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/*.zip
            dist/*-setup.exe
