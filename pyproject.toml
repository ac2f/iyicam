[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iyicam"
version = "0.1.0"
description = "Modular 2D/2.5D CAM for CNC routers: vectors, layers, sheets, toolpaths, nesting and post-processors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyclipper>=1.3",
    "numpy>=1.24",
    "ezdxf>=1.1",
    "svgelements>=1.9",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.5"]
dev = ["pytest>=7", "PySide6-Essentials>=6.5"]

[project.scripts]
iyicam = "iyicam.__main__:main"

[project.entry-points."iyicam.plugins"]
# Third party packages can expose plugins here, e.g.
# my_plugin = "my_package.my_plugin"

[tool.setuptools.packages.find]
include = ["iyicam*"]

[tool.setuptools.package-data]
"iyicam.post" = ["builtin/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
